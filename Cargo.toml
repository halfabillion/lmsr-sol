[workspace]
resolver = "2"
members = ["math", "program"]

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"
# strip / panic = "abort" were tried: they made the SBF .so larger (87,056 B), so they are left off.

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
